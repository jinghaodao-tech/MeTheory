name: Verify

on:
  push:
  pull_request:

concurrency:
  group: metheory-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: MeTheory
      - uses: actions/checkout@v4
        with:
          repository: jinghaodao-tech/Personal-Context-Studio
          ref: 7b1224ca45b357139c0c4dc12cc1a82fa9d858a2
          path: Personal-Context-Studio
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MeTheory/package-lock.json
      - run: npm ci
        working-directory: MeTheory
      - run: npm ci
        working-directory: Personal-Context-Studio
      - run: npm run verify
        working-directory: MeTheory
      - run: npm run test:pcs-live-e2e
        working-directory: MeTheory
        env:
          PCS_REPO_PATH: ${{ github.workspace }}/Personal-Context-Studio
      - name: PostgreSQL analysis smoke test
        if: ${{ secrets.METHEORY_POSTGRES_URL != '' }}
        run: npm run db:migrate:postgres && npm run test -- test/postgres-live.test.ts
        working-directory: MeTheory
        env:
          METHEORY_POSTGRES_URL: ${{ secrets.METHEORY_POSTGRES_URL }}
