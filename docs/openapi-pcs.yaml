openapi: 3.0.3
info:
  title: MeTheory PCS API
  version: 2.0.0
  description: Local-only PCS Snapshot V2 analysis and explicit experiment review loop.
servers:
  - url: http://127.0.0.1:8100
paths:
  /v1/pcs/profile-binding:
    post: { summary: Bind a local user to one PCS profile, responses: { '201': { description: Bound }, '409': { description: Profile mismatch } } }
    get: { summary: Read a binding, responses: { '200': { description: Binding } } }
    delete: { summary: Remove a binding, responses: { '200': { description: Removed } } }
  /v1/pcs/analyze:
    post:
      summary: Validate, hash, and analyze a PCS Snapshot V2
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyzeRequest' } } } }
      responses: { '201': { description: Analysis run }, '400': { description: Invalid snapshot }, '409': { description: Profile or content mismatch } }
  /v1/pcs/live-analyze:
    post: { summary: Read a localhost PCS snapshot then analyze it, responses: { '201': { description: Analysis run }, '401': { description: PCS unauthorized }, '403': { description: PCS profile forbidden }, '502': { description: PCS unavailable } } }
  /v1/pcs/analysis-history:
    get: { summary: List saved analysis runs, responses: { '200': { description: Runs } } }
  /v1/pcs/experiment-draft:
    post: { summary: Create an explicit experiment draft, responses: { '201': { description: Draft } } }
  /v1/pcs/experiments/{id}/evaluate:
    post: { summary: Evaluate a completed experiment deterministically, responses: { '200': { description: Evaluation }, '409': { description: Experiment not completed } } }
  /v1/pcs/experiments/{id}/self-model-candidate:
    post:
      summary: Create a proposed self-model candidate from an evaluated PCS experiment; it requires a separate user approval.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SelfModelProposalRequest' } } } }
      responses: { '201': { description: Proposed candidate }, '400': { description: Invalid statement }, '409': { description: Experiment not evaluated } }
components:
  schemas:
    AnalyzeRequest:
      type: object
      required: [userId, snapshot]
      properties:
        userId: { type: string }
        maximumCandidates: { type: integer, minimum: 1, maximum: 5 }
        snapshot: { $ref: '#/components/schemas/PcsSnapshotV2' }
    PcsSnapshotV2:
      type: object
      required: [schemaVersion, snapshotId, profileId, period, records]
      properties:
        schemaVersion: { type: string, enum: [pcs-analysis-snapshot-v2] }
        snapshotId: { type: string }
        profileId: { type: string }
        period: { type: object, required: [from, to, timezone], properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time }, timezone: { type: string } } }
        records: { type: array, items: { $ref: '#/components/schemas/PcsRecord' } }
    PcsRecord:
      type: object
      required: [recordId, recordedAt, templateId, templateVersionId, fieldKey, valueType, analysisRole, analysisRoleConfirmed, analysisUsage, analysisMergeAllowed]
      properties:
        recordId: { type: string }
        recordedAt: { type: string, format: date-time }
        templateId: { type: string }
        templateVersionId: { type: string }
        fieldKey: { type: string }
        valueType: { type: string, enum: [boolean, number, single_choice] }
        analysisRole: { type: string }
        analysisRoleConfirmed: { type: boolean }
        analysisUsage: { type: string, enum: [condition, outcome, both, excluded] }
        analysisMergeAllowed: { type: boolean }
    SelfModelProposalRequest:
      type: object
      required: [userId, statement]
      properties:
        userId: { type: string }
        statement: { type: string, minLength: 1 }
        constructKey: { type: string }
        note: { type: string }
