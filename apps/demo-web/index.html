<!doctype html><meta charset="utf-8"><title>MeTheory PCS V2 Demo</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#fafafa;color:#222}section{background:white;padding:20px;margin:16px 0;border:1px solid #ddd;border-radius:10px}button{padding:8px 14px;margin:4px 0}input{padding:8px;width:90%}pre{white-space:pre-wrap;background:#f2f2f2;padding:12px;border-radius:6px}</style>
<h1>MeTheory / PCS Snapshot V2</h1><p>ローカル検証用デモ。API は <code>http://127.0.0.1:8100</code> を使用します。</p>
<section><h2>Profile binding</h2><input id="user" value="demo-user"><input id="profile" value="demo-profile"><button onclick="bind()">Bind</button><pre id="binding"></pre></section>
<section><h2>Fixture analysis</h2><button onclick="analyze()">Analyze Snapshot</button><pre id="result"></pre></section>
<section><h2>Candidate review</h2><input id="reviewRunId" placeholder="runId"><input id="reviewCandidateId" value="candidate_1"><select id="rating"><option>fits</option><option>does_not_fit</option><option>on_hold</option></select><button onclick="review()">Save review</button><pre id="review"></pre></section>
<section><h2>Analysis history</h2><button onclick="history()">Refresh</button><pre id="history"></pre></section>
<section><h2>Experiment</h2><input id="runId" placeholder="runId"><input id="candidateId" value="candidate_1"><input id="title" value="Demo experiment"><button onclick="draft()">Create Draft</button><input id="draftId" placeholder="draftId"><button onclick="acceptDraft()">Accept</button><button onclick="startExperiment()">Start</button><input id="experimentId" placeholder="experimentId"><button onclick="observe('A',4)">Observe A</button><button onclick="observe('B',2)">Observe B</button><button onclick="transition('completed')">Complete</button><button onclick="evaluate()">Evaluate</button><input id="selfModelStatement" value="私は明確な条件で作業すると集中しやすい"><button onclick="proposeSelfModel()">Propose for approval</button><pre id="experiment"></pre></section>
<script>
const api='http://127.0.0.1:8100'; const $=id=>document.getElementById(id); const user=()=>encodeURIComponent($('user').value);
async function call(path, options={}){const r=await fetch(api+path,options); const v=await r.json(); if(!r.ok) throw new Error(JSON.stringify(v)); return v}
async function ensureUser(){return call('/v1/users',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:$('user').value,authSubject:$('user').value})})}
async function bind(){try{await ensureUser();$('binding').textContent=JSON.stringify(await call('/v1/pcs/profile-binding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:$('user').value,profileId:$('profile').value})}),null,2)}catch(e){$('binding').textContent=e}}
function snapshot(){return {schemaVersion:'pcs-analysis-snapshot-v2',snapshotId:'demo-snapshot-1',profileId:$('profile').value,period:{from:'2026-07-01T00:00:00.000Z',to:'2026-07-31T00:00:00.000Z',timezone:'Asia/Tokyo'},records:[{recordId:'demo-record-1',recordedAt:'2026-07-15T12:00:00.000Z',templateId:'demo-template',templateVersionId:'demo-v1',fieldKey:'task_clarity',valueType:'number',value:4,analysisRole:'task_clarity',analysisRoleConfirmed:true,analysisUsage:'condition',analysisMergeAllowed:false}]}}
async function analyze(){try{$('result').textContent=JSON.stringify(await call('/v1/pcs/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:$('user').value,snapshot:snapshot(),maximumCandidates:5})}),null,2)}catch(e){$('result').textContent=e}}
async function review(){try{$('review').textContent=JSON.stringify(await call('/v1/pcs/analysis-runs/'+$('reviewRunId').value+'/candidate-review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:$('user').value,candidateId:$('reviewCandidateId').value,rating:$('rating').value})}),null,2)}catch(e){$('review').textContent=e}}
async function history(){try{$('history').textContent=JSON.stringify(await call('/v1/pcs/analysis-history?userId='+user()),null,2)}catch(e){$('history').textContent=e}}
async function draft(){try{$('experiment').textContent=JSON.stringify(await call('/v1/pcs/experiment-draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:$('user').value,runId:$('runId').value,candidateId:$('candidateId').value,title:$('title').value,plan:{}})}),null,2)}catch(e){$('experiment').textContent=e}}
async function exp(path,payload={}){return call(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:$('user').value,...payload})})}
async function acceptDraft(){try{$('experiment').textContent=JSON.stringify(await exp('/v1/pcs/experiment-draft/'+$('draftId').value+'/accept'),null,2)}catch(e){$('experiment').textContent=e}}
async function startExperiment(){try{$('experiment').textContent=JSON.stringify(await exp('/v1/pcs/experiments/'+$('draftId').value+'/start'),null,2)}catch(e){$('experiment').textContent=e}}
async function observe(group,value){try{$('experiment').textContent=JSON.stringify(await exp('/v1/pcs/experiments/'+$('experimentId').value+'/observation',{observation:{group,value}}),null,2)}catch(e){$('experiment').textContent=e}}
async function transition(status){try{$('experiment').textContent=JSON.stringify(await exp('/v1/pcs/experiments/'+$('experimentId').value+'/transition',{status}),null,2)}catch(e){$('experiment').textContent=e}}
async function evaluate(){try{$('experiment').textContent=JSON.stringify(await exp('/v1/pcs/experiments/'+$('experimentId').value+'/evaluate'),null,2)}catch(e){$('experiment').textContent=e}}
async function proposeSelfModel(){try{$('experiment').textContent=JSON.stringify(await exp('/v1/pcs/experiments/'+$('experimentId').value+'/self-model-candidate',{statement:$('selfModelStatement').value}),null,2)}catch(e){$('experiment').textContent=e}}
</script>
